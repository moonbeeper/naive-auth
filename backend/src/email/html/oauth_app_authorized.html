<!DOCTYPE html>
<html>
  <body>
    <div
      style="
        background-color: #000000;
        color: #ffffff;
        font-family: 'Iowan Old Style', 'Palatino Linotype', 'URW Palladio L',
          P052, serif;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 0.15008px;
        line-height: 1.5;
        margin: 0;
        padding: 32px 0;
        min-height: 100%;
        width: 100%;
      "
    >
      <table
        align="center"
        width="100%"
        style="margin: 0 auto; max-width: 600px; background-color: #000000"
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
      >
        <tbody>
          <tr style="width: 100%">
            <td>
              <div style="padding: 24px 24px 16px 24px; text-align: left">
                <img
                  alt="BeepAuth Logo"
                  src="{{ logo_url }}"
                  height="42"
                  style="
                    height: 42px;
                    outline: none;
                    border: none;
                    text-decoration: none;
                    vertical-align: middle;
                    display: inline-block;
                    max-width: 100%;
                  "
                />
              </div>
              <h2
                style="
                  font-weight: bold;
                  margin: 0;
                  font-size: 24px;
                  padding: 16px 24px 16px 24px;
                "
              >
                Hi {{ login }},
              </h2>
              <div
                style="
                  color: #ffffff;
                  font-size: 16px;
                  font-weight: normal;
                  text-align: left;
                  padding: 16px 24px 16px 24px;
                "
              >
                You just {% if is_reauthorize %} re-{% endif %}authorized an OAuth application ({{ app_name }}) access
                to your account.
              </div>
              <div
                style="
                  color: #d4d4d4;
                  font-size: 16px;
                  font-weight: normal;
                  text-align: left;
                  padding: 16px 24px 16px 24px;
                "
              >
                It has these{% if is_upgrade %} new{% endif%} permissions: {{
                scopes }}
              </div>
              <div
                style="
                  color: #868686;
                  font-size: 13px;
                  font-weight: normal;
                  text-align: center;
                  padding: 16px 24px 16px 24px;
                "
              >
                :3
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
