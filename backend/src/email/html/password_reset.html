<!DOCTYPE html>
<html>
  <body>
    <div
      style="
        background-color: #000000;
        color: #ffffff;
        font-family: 'Iowan Old Style', 'Palatino Linotype', 'URW Palladio L',
          P052, serif;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 0.15008px;
        line-height: 1.5;
        margin: 0;
        padding: 32px 0;
        min-height: 100%;
        width: 100%;
      "
    >
      <table
        align="center"
        width="100%"
        style="margin: 0 auto; max-width: 600px; background-color: #000000"
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
      >
        <tbody>
          <tr style="width: 100%">
            <td>
              <div style="padding: 24px 24px 16px 24px; text-align: left">
                <img
                  alt="BeepAuth Logo"
                  src="{{ logo_url }}"
                  height="42"
                  style="
                    height: 42px;
                    outline: none;
                    border: none;
                    text-decoration: none;
                    vertical-align: middle;
                    display: inline-block;
                    max-width: 100%;
                  "
                />
              </div>
              <h2
                style="
                  font-weight: bold;
                  margin: 0;
                  font-size: 24px;
                  padding: 16px 24px 16px 24px;
                "
              >
                Reset your password
              </h2>
              <div
                style="
                  color: #ffffff;
                  font-size: 16px;
                  font-weight: normal;
                  text-align: left;
                  padding: 16px 24px 16px 24px;
                "
              >
                Seems like you want to reset your password... If so click the
                button below:
              </div>
              <div style="text-align: center; padding: 16px 24px 16px 24px">
                <a
                  href="{{ reset_url }}"
                  style="
                    color: #ffffff;
                    font-size: 16px;
                    font-weight: bold;
                    background-color: #02c39a;
                    border-radius: 4px;
                    display: block;
                    padding: 12px 20px;
                    text-decoration: none;
                  "
                  target="_blank"
                  ><span
                    ><!--[if mso
                      ]><i
                        style="
                          letter-spacing: 20px;
                          mso-font-width: -100%;
                          mso-text-raise: 30;
                        "
                        hidden
                        >&nbsp;</i
                      ><!
                    [endif]--></span
                  ><span>Reset your password</span
                  ><span
                    ><!--[if mso
                      ]><i
                        style="letter-spacing: 20px; mso-font-width: -100%"
                        hidden
                        >&nbsp;</i
                      ><!
                    [endif]--></span
                  ></a
                >
              </div>
              <div
                style="
                  color: #d4d4d4;
                  font-size: 16px;
                  font-weight: normal;
                  text-align: left;
                  padding: 16px 24px 16px 24px;
                "
              >
                If this you didn&#x27;t request this... just ignore it lol.
              </div>
              <div
                style="
                  color: #868686;
                  font-size: 13px;
                  font-weight: normal;
                  text-align: center;
                  padding: 16px 24px 16px 24px;
                "
              >
                :3 - Link ID: {{ raw_code }}
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
